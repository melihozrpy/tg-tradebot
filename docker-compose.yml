      GROQ_ENABLED: ${GROQ_ENABLED:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TIMEZONE_NAME: ${TIMEZONE_NAME:-Europe/Istanbul}
      INSTRUMENTS: '${INSTRUMENTS:-["THYAO","ASELS","KCHOL","GARAN","AKBNK","SASA","BIMAS","EREGL","TCELL","FROTO"]}'
