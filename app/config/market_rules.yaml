# BIST piyasa kurallari. Fiyat adimi ve gunluk limit gibi islem-kritik
# degerlerde lisansli/veri-zamanli saglayici kaydi esastir.
market:
  timezone: Europe/Istanbul
  session_open: "10:00"
  session_close: "18:00"
  lot_step: 1
  price_tick: 0.01

price_limits:
  # BIST fiyat marjlari pazar/urun/islem yontemine gore degisebilir. Evrensel
  # bir %10 varsayimi yapilmaz; ust/alt limitler enstruman bazinda saglayicidan
  # alinmalidir.
  daily_price_limit_percent: null
