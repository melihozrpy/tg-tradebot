      CLOSE_SCAN_ENABLED: ${CLOSE_SCAN_ENABLED:-false}
      USER_PRICE_ALERTS_ENABLED: ${USER_PRICE_ALERTS_ENABLED:-true}
      USER_PRICE_ALERT_POLL_SECONDS: ${USER_PRICE_ALERT_POLL_SECONDS:-30}
      USER_PRICE_ALERT_DELIVERY_POLL_SECONDS: ${USER_PRICE_ALERT_DELIVERY_POLL_SECONDS:-5}
      USER_PRICE_ALERT_DEFAULT_REPEAT_SECONDS: ${USER_PRICE_ALERT_DEFAULT_REPEAT_SECONDS:-60}
