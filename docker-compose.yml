      USER_PRICE_ALERT_AUDIO_ENABLED: ${USER_PRICE_ALERT_AUDIO_ENABLED:-true}
      USER_PRICE_ALERT_OCR_ENABLED: ${USER_PRICE_ALERT_OCR_ENABLED:-true}
      USER_PRICE_ALERT_OCR_LANGUAGE: ${USER_PRICE_ALERT_OCR_LANGUAGE:-tur+eng}
      USER_PRICE_ALERT_TEMP_FILE_TTL_MINUTES: ${USER_PRICE_ALERT_TEMP_FILE_TTL_MINUTES:-30}
      USER_PRICE_ALERT_MAX_IMAGE_BYTES: ${USER_PRICE_ALERT_MAX_IMAGE_BYTES:-10485760}
      USER_PRICE_ALERT_MAX_FILE_BYTES: ${USER_PRICE_ALERT_MAX_FILE_BYTES:-10485760}
      LONG_ONLY: ${LONG_ONLY:-true}
      SIGNAL_MONITOR_ENABLED: ${SIGNAL_MONITOR_ENABLED:-true}
      SIGNAL_MONITOR_INTERVAL_SECONDS: ${SIGNAL_MONITOR_INTERVAL_SECONDS:-5}
      ALLOW_DELAYED_DATA_FOR_LIVE_TRIGGER: ${ALLOW_DELAYED_DATA_FOR_LIVE_TRIGGER:-false}
      MAX_MARKET_DATA_STALENESS_SECONDS: ${MAX_MARKET_DATA_STALENESS_SECONDS:-}
      DEFAULT_RISK_PERCENT: ${DEFAULT_RISK_PERCENT:-1.0}
      MAX_POSITION_PERCENT: ${MAX_POSITION_PERCENT:-20}
      MAX_DAILY_VOLUME_PARTICIPATION_PERCENT: ${MAX_DAILY_VOLUME_PARTICIPATION_PERCENT:-1}
