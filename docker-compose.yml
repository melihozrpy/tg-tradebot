services:
  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////app/data/mergen_quant.db
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ADMIN_TELEGRAM_USER_IDS: ${ADMIN_TELEGRAM_USER_IDS:-}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-polling}
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-yfinance}
      LICENSED_MARKET_DATA_BASE_URL: ${LICENSED_MARKET_DATA_BASE_URL:-}
      LICENSED_MARKET_DATA_API_KEY: ${LICENSED_MARKET_DATA_API_KEY:-}
      LICENSED_MARKET_DATA_API_KEY_HEADER: ${LICENSED_MARKET_DATA_API_KEY_HEADER:-X-API-Key}
      LICENSED_MARKET_DATA_QUOTE_PATH: ${LICENSED_MARKET_DATA_QUOTE_PATH:-/quote/{symbol}}
