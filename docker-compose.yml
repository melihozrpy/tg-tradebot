      BACKTEST_LIMIT_LOCK_MODE: ${BACKTEST_LIMIT_LOCK_MODE:-conservative}
      BACKTEST_PRICE_MODE: ${BACKTEST_PRICE_MODE:-split_adjusted}
      BACKTEST_COMMISSION_RATE: ${BACKTEST_COMMISSION_RATE:-}
      BACKTEST_COMMISSION_MINIMUM: ${BACKTEST_COMMISSION_MINIMUM:-}
      BACKTEST_COMMISSION_TAX_RATE: ${BACKTEST_COMMISSION_TAX_RATE:-}
      BACKTEST_INCLUDE_DIVIDENDS: ${BACKTEST_INCLUDE_DIVIDENDS:-true}
      FUNDAMENTAL_PROVIDER: ${FUNDAMENTAL_PROVIDER:-auto}
      KAP_PROVIDER: ${KAP_PROVIDER:-disabled}
      FUNDAMENTAL_CROSS_CHECK_ENABLED: ${FUNDAMENTAL_CROSS_CHECK_ENABLED:-false}
      FUNDAMENTAL_CROSS_CHECK_STRICT: ${FUNDAMENTAL_CROSS_CHECK_STRICT:-true}
