[project]
name = "mergen-quant"
version = "3.0.0"
description = "Montana Melih Hisse Bot - BIST analiz, alarm, sinyal, portfoy risk ve backtest sistemi"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "apscheduler>=3.10.4",
    "httpx>=0.27.0",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "python-telegram-bot>=21.3",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.1",
    "yfinance>=0.2.40",
    "matplotlib>=3.8.0",
    "Pillow>=10.3.0",
    "openpyxl>=3.1.5",
    "pytesseract>=0.3.13",
    "beautifulsoup4>=4.12.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

