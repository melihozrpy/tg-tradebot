[project]
name = "mergen-quant"
version = "3.0.0"
description = "MERGEN QUANT - Akilli BIST Analiz ve Risk Sistemi (Telegram hisse analiz, tarama, sinyal takip, portfoy risk ve backtest botu, ucretsiz veri)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "apscheduler>=3.10.4",
    "httpx>=0.27.0",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "python-telegram-bot>=21.3",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.1",
    "yfinance>=0.2.40",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

