      MORNING_REPORT_ENABLED: ${MORNING_REPORT_ENABLED:-true}
      MORNING_REPORT_TIME: ${MORNING_REPORT_TIME:-08:00}
      EVENING_MARKET_REPORT_ENABLED: ${EVENING_MARKET_REPORT_ENABLED:-true}
      EVENING_MARKET_REPORT_TIME: ${EVENING_MARKET_REPORT_TIME:-21:00}
      DAILY_BRIEF_ENABLED: ${DAILY_BRIEF_ENABLED:-false}
      REPORT_CHART_OUTPUT_DIR: ${REPORT_CHART_OUTPUT_DIR:-/tmp/mergen_quant_reports}
      REPORT_MAX_NEWS_EVENTS: ${REPORT_MAX_NEWS_EVENTS:-8}
      CHART_DPI: ${CHART_DPI:-120}
      ECONOMIC_CALENDAR_ENABLED: ${ECONOMIC_CALENDAR_ENABLED:-true}
      ECONOMIC_CALENDAR_URL: ${ECONOMIC_CALENDAR_URL:-https://tr.investing.com/economic-calendar/}
      ECONOMIC_CALENDAR_TIMEOUT_SECONDS: ${ECONOMIC_CALENDAR_TIMEOUT_SECONDS:-15}
      VIX_SYMBOL: ${VIX_SYMBOL:-^VIX}
      DXY_SYMBOL: ${DXY_SYMBOL:-DX-Y.NYB}
      UNIVERSE_SCAN_TOP_N: ${UNIVERSE_SCAN_TOP_N:-50}
      UNIVERSE_SCAN_MAX_SYMBOLS_PER_RUN: ${UNIVERSE_SCAN_MAX_SYMBOLS_PER_RUN:-1000}
      UNIVERSE_SCAN_WORKERS: ${UNIVERSE_SCAN_WORKERS:-3}
      UNIVERSE_SCAN_CACHE_MINUTES: ${UNIVERSE_SCAN_CACHE_MINUTES:-60}
      UNIVERSE_SCAN_MINIMUM_SCORE: ${UNIVERSE_SCAN_MINIMUM_SCORE:-68}
      VIRTUAL_PORTFOLIO_MAX_PER_USER: ${VIRTUAL_PORTFOLIO_MAX_PER_USER:-3}
      VIRTUAL_PORTFOLIO_MAX_STRATEGIES: ${VIRTUAL_PORTFOLIO_MAX_STRATEGIES:-2}
      VIRTUAL_TRADE_RISK_PERCENT: ${VIRTUAL_TRADE_RISK_PERCENT:-1.0}
      VIRTUAL_TRADE_AFTER_LOSS_RISK_PERCENT: ${VIRTUAL_TRADE_AFTER_LOSS_RISK_PERCENT:-0.5}
      VIRTUAL_TRADE_MINIMUM_RR: ${VIRTUAL_TRADE_MINIMUM_RR:-2.0}
      VIRTUAL_TRADE_MINIMUM_CHECKLIST: ${VIRTUAL_TRADE_MINIMUM_CHECKLIST:-5}
      VIRTUAL_TRADE_BLOCKED_WEEKDAYS: ${VIRTUAL_TRADE_BLOCKED_WEEKDAYS:-0,4}
    expose:
      - "8000"
    volumes:
      - mergen_data:/app/data
      - ./data_csv:/app/data_csv:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

