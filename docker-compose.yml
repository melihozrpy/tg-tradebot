      FINTABLES_MCP_BEARER_TOKEN: ${FINTABLES_MCP_BEARER_TOKEN:-}
      FINTABLES_MCP_TOOL_NAME: ${FINTABLES_MCP_TOOL_NAME:-}
      FINTABLES_MCP_SYMBOL_ARGUMENT: ${FINTABLES_MCP_SYMBOL_ARGUMENT:-symbol}
